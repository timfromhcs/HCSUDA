<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HCSUDA WebGPU / WASM demo</title>
  <style>
    body { font-family: Segoe UI, system-ui, sans-serif; margin: 0; background: #0f1b2a; color: #e8f2ff; }
    main { max-width: 860px; margin: 48px auto; padding: 0 20px; }
    h1 { font-size: 28px; margin-bottom: 4px; }
    .tag { color: #20d7c8; font-size: 14px; }
    .card { background: #16273b; border: 1px solid #2d4d6b; border-radius: 12px; padding: 20px; margin-top: 22px; }
    button { background: #4aa8ff; color: #061322; border: 0; border-radius: 6px; padding: 9px 16px; font-weight: 700; cursor: pointer; }
    code { color: #8fe3d8; }
    .note { color: #92b4d0; font-size: 14px; }
    .error { color: #ff9c9c; }
  </style>
</head>
<body>
<main>
  <h1>HCSUDA <span class="tag">WebGPU / WebAssembly demo</span></h1>
  <p class="note">Browser-only demonstration of the documented <code>vecadd_f32</code> shape.
  WebGPU executes the kernel; a WebAssembly module computes the CPU reference.
  This is <strong>not</strong> the native HCSUDA runtime and makes no performance claim.</p>
  <div class="card">
    <p><button id="run">Run 1,001-element check</button></p>
    <p id="status">Idle.</p>
    <p id="detail" class="note"></p>
    <p id="error" class="error"></p>
  </div>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
