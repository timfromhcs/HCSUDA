name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 (${{ matrix.preset }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-tests, windows-cpu-only]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset windows-tests --output-on-failure
        if: matrix.preset == 'windows-tests'

      - name: Run hcsdoctor (diagnostics)
        run: |
          $exe = Get-ChildItem -Recurse -Filter hcsdoctor.exe build | Select-Object -First 1
          if ($exe) { & $exe.FullName --json } else { Write-Error "hcsdoctor not built" }
        shell: pwsh

  cpu-only-tests:
    name: Windows x64 CPU-only tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-cpu-only
      - name: Build
        run: cmake --build --preset windows-cpu-only --parallel
      - name: Test
        run: |
          $exe = Get-ChildItem -Recurse -Filter hcs_tests.exe build | Select-Object -First 1
          & $exe.FullName
        shell: pwsh

  validation:
    name: Windows x64 Vulkan validation layers
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-validation
      - name: Build
        run: cmake --build --preset windows-validation --parallel
      - name: Test with validation layers
        run: ctest --preset windows-validation --timeout 180 --output-on-failure
        # Hosted runners may not ship the Vulkan SDK/validation layer; real hardware QA is
        # documented as a separate self-hosted workflow, never silently reported as passed.
        continue-on-error: true

  installer:
    name: Windows x64 single-file installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          cmake --preset windows-tests
          cmake --build --preset windows-tests --parallel
      - name: Build installer and checksum
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\make_installer.ps1
      - name: Scan release artifact
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\check-artifact.ps1
      - name: Test install and uninstall
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\installer\test_installer.ps1
      - name: Test in-place upgrade
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\installer\test_upgrade.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: hcsuda-setup-x64
          path: |
            artifacts/HCSUDA-Setup-x64.exe
            artifacts/HCSUDA-Setup-x64.exe.sha256

  secrets:
    name: Repository contract gates
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\check-secrets.ps1
      - name: Validate OpenAPI contract
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\check-openapi.ps1

  web-demo:
    name: WebGPU/WASM demo gate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify WASM reference kernel
        run: node webgpu-demo/test-wasm.mjs

  static-analysis:
    name: Windows x64 MSVC static analysis
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-analyze
      - name: Build with /analyze
        run: cmake --build --preset windows-analyze --parallel
