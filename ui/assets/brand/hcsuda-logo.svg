<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" role="img" aria-label="HCSUDA — HCS Unified Compute Runtime">
  <title>HCSUDA</title>
  <desc>Original HCSUDA mark: a rounded compute lattice with a central H, followed by the product name. No vendor logo is imitated.</desc>
  <defs>
    <linearGradient id="hcsGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#20d7c8"/>
    </linearGradient>
  </defs>
  <g transform="translate(8 10)">
    <rect x="0" y="0" width="76" height="76" rx="18" fill="#0f1b2a" stroke="url(#hcsGradient)" stroke-width="3"/>
    <path d="M20 16v44M56 16v44M20 38h36" fill="none" stroke="url(#hcsGradient)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="20" cy="16" r="4" fill="#20d7c8"/>
    <circle cx="56" cy="60" r="4" fill="#4aa8ff"/>
  </g>
  <text x="104" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#e8f2ff">HCSUDA</text>
  <text x="105" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7fb2d8">HCS Unified Compute Runtime</text>
</svg>
